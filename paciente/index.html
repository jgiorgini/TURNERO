<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Turnos – Paciente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px;
    }
    p {
      margin-top: 0;
      color: #555;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 12px;
    }
    .btn-primary {
      background: #1976d2;
      color: #fff;
    }
    .btn-secondary {
      background: #eee;
    }
    .turnos {
      margin-top: 16px;
    }
    .turno {
      border-radius: 10px;
      border: 1px solid #ddd;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .turno span {
      display: block;
    }
    .alert {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .alert-ok {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .alert-error {
      background: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reservar turno</h1>
    <p>Seleccioná el tipo de consulta y luego elegí uno de los turnos disponibles.</p>

    <label for="tratamiento">Tipo de tratamiento</label>
    <select id="tratamiento">
      <option value="">Seleccionar…</option>
    </select>

    <label for="fechaDesde">Desde (opcional)</label>
    <input type="date" id="fechaDesde">

    <label for="fechaHasta">Hasta (opcional)</label>
    <input type="date" id="fechaHasta">

    <button class="btn-primary" id="btnBuscar">Buscar turnos</button>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="turnos" id="listaTurnos"></div>

    <div id="formReserva" style="display:none; margin-top:16px;">
      <h2 style="font-size:1.1rem; margin-bottom:6px;">Confirmar reserva</h2>
      <p id="resumenTurno" style="font-size:0.9rem; color:#444;"></p>

      <label for="paciente_nombre">Nombre y apellido</label>
      <input type="text" id="paciente_nombre" placeholder="Juan Pérez">

      <label for="paciente_contacto">Teléfono o email</label>
      <input type="text" id="paciente_contacto" placeholder="Contacto">

      <button class="btn-primary" id="btnConfirmar">Confirmar turno</button>
      <button class="btn-secondary" id="btnCancelar">Cancelar</button>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxFKqm9-Do257GUJY5pknVh1oCMjSM_ByilL5yHja7x7zue-qNb6gn_Skenbj9bQ5kg/exec"; // <-- reemplazar

  let turnosActuales = [];
  let turnoSeleccionado = null;

  async function fetchJSON(url, options = {}) {
    const res = await fetch(url, options);
    const data = await res.json();
    return data;
  }

  function mostrarAlerta(msg, tipo = "ok") {
    const el = document.getElementById("alert");
    el.style.display = "block";
    el.textContent = msg;
    el.className = "alert " + (tipo === "ok" ? "alert-ok" : "alert-error");
  }

  function limpiarAlerta() {
    const el = document.getElementById("alert");
    el.style.display = "none";
  }

  async function cargarTratamientos() {
    try {
      const data = await fetchJSON(API_URL + "?action=listarTratamientos");
      const select = document.getElementById("tratamiento");
      select.innerHTML = '<option value="">Seleccionar…</option>';

      if (data.ok && data.tratamientos) {
        data.tratamientos.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t.id_tratamiento;
          opt.textContent = t.nombre;
          select.appendChild(opt);
        });
      }
    } catch (err) {
      mostrarAlerta("Error al cargar tratamientos", "error");
      console.error(err);
    }
  }

  async function buscarTurnos() {
    limpiarAlerta();
    document.getElementById("listaTurnos").innerHTML = "";
    document.getElementById("formReserva").style.display = "none";

    const idTratamiento = document.getElementById("tratamiento").value;
    if (!idTratamiento) {
      mostrarAlerta("Seleccioná un tipo de tratamiento", "error");
      return;
    }

    const fechaDesde = document.getElementById("fechaDesde").value;
    const fechaHasta = document.getElementById("fechaHasta").value;

    const params = new URLSearchParams({
      action: "listarTurnosDisponibles",
      idTratamiento
    });
    if (fechaDesde) params.append("fechaDesde", fechaDesde);
    if (fechaHasta) params.append("fechaHasta", fechaHasta);

    try {
      const data = await fetchJSON(API_URL + "?" + params.toString());
      if (!data.ok) {
        mostrarAlerta(data.error || "Error al buscar turnos", "error");
        return;
      }

      turnosActuales = data.turnos || [];

      if (turnosActuales.length === 0) {
        mostrarAlerta("No hay turnos disponibles para ese tratamiento y rango de fechas", "error");
        return;
      }

      const cont = document.getElementById("listaTurnos");
      cont.innerHTML = "";

      turnosActuales.forEach(t => {
        const div = document.createElement("div");
        div.className = "turno";
        div.innerHTML = `
          <div>
            <span><strong>${t.fecha}</strong></span>
            <span>${t.hora_inicio} – ${t.hora_fin}</span>
          </div>
          <button class="btn-primary" data-id="${t.id_turno}">Tomar</button>
        `;
        cont.appendChild(div);
      });

      // delegación de eventos
      cont.addEventListener("click", (ev) => {
        const btn = ev.target.closest("button[data-id]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        seleccionarTurno(id);
      }, { once: true });

    } catch (err) {
      mostrarAlerta("Error al buscar turnos", "error");
      console.error(err);
    }
  }

  function seleccionarTurno(id_turno) {
    turnoSeleccionado = turnosActuales.find(t => t.id_turno === id_turno);
    if (!turnoSeleccionado) return;

    const resumen = document.getElementById("resumenTurno");
    resumen.textContent = `Vas a reservar el turno del ${turnoSeleccionado.fecha} de ${turnoSeleccionado.hora_inicio} a ${turnoSeleccionado.hora_fin}.`;

    document.getElementById("formReserva").style.display = "block";
    document.getElementById("paciente_nombre").value = "";
    document.getElementById("paciente_contacto").value = "";
  }

  async function confirmarReserva() {
    if (!turnoSeleccionado) return;

    const paciente_nombre = document.getElementById("paciente_nombre").value.trim();
    const paciente_contacto = document.getElementById("paciente_contacto").value.trim();

    if (!paciente_nombre) {
      mostrarAlerta("Ingresá tu nombre para confirmar", "error");
      return;
    }

    try {
      const res = await fetchJSON(API_URL + "?action=reservarTurno", {
        method: "POST",
        body: JSON.stringify({
          id_turno: turnoSeleccionado.id_turno,
          paciente_nombre,
          paciente_contacto
        })
      });

      if (!res.ok) {
        mostrarAlerta(res.error || "No se pudo reservar el turno", "error");
        return;
      }

      mostrarAlerta("Turno reservado correctamente", "ok");
      document.getElementById("formReserva").style.display = "none";
      document.getElementById("listaTurnos").innerHTML = "";
      turnoSeleccionado = null;

    } catch (err) {
      mostrarAlerta("Error al reservar turno", "error");
      console.error(err);
    }
  }

  document.getElementById("btnBuscar").addEventListener("click", buscarTurnos);
  document.getElementById("btnConfirmar").addEventListener("click", confirmarReserva);
  document.getElementById("btnCancelar").addEventListener("click", () => {
    document.getElementById("formReserva").style.display = "none";
    turnoSeleccionado = null;
  });

  cargarTratamientos();
</script>
</body>
</html>
