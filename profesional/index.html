<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {

      margin: 0;

    .card {

  <img id="logoConsultorio"
       src=""

  <img
    src="https://jgiorgini.github.io/TURNERO/assets/logo_esthetic_glam.png"
    alt="Logo consultorio"

  >
  <div>

    <div style="font-size:0.8rem; color:#777;">El mimo que necesitás</div>

</div>

    <div style="font-size:0.8rem; color:#777;">El mimo que necesitás</div>
  </div>
</div>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
  <img id="logoConsultorio" src="" alt="Logo consultorio" style="height:48px; border-radius:50%; object-fit:contain; background:#fff;">
  <div>
    <h1 style="margin:0; font-size:1.3rem;">Esthetic glam</h1>
    <div style="font-size:0.8rem; color:#777;">El mimo que necesitás</div>

      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px;
    }
    label {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    select, input {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;

      margin-right: 4px;
    }
    .btn-primary {
      background: #1976d2;
      color: #fff;
    }
    .btn-secondary {
      background: #eee;
    }
    .btn-danger {
      background: #e53935;
      color: #fff;
    }
    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 12px;
      align-items: flex-end;
    }
    .filtros > div {
      min-width: 140px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;

      vertical-align: middle;
    }
    th {
      background: #fafafa;
    }
    .estado-LIBRE { color: #2e7d32; font-weight: 600; }
    .estado-RESERVADO { color: #ef6c00; font-weight: 600; }
    .estado-CANCELADO { color: #c62828; font-weight: 600; }
    .alert {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .alert-ok {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .alert-error {
      background: #ffebee;
      color: #c62828;
    }
    .seccion {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Panel de turnos – Profesional</h1>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="seccion">
      <h2 style="font-size:1rem; margin-top:0;">Filtros</h2>
      <div class="filtros">
        <div>
          <label for="f_fechaDesde">Desde</label>
          <input type="date" id="f_fechaDesde">
        </div>
        <div>
          <label for="f_fechaHasta">Hasta</label>
          <input type="date" id="f_fechaHasta">
        </div>
        <div>
          <label for="f_tratamiento">Tratamiento</label>
          <select id="f_tratamiento">
            <option value="">Todos</option>
          </select>
        </div>
        <div>
          <label for="f_estado">Estado</label>
          <select id="f_estado">
            <option value="">Todos</option>
            <option value="LIBRE">LIBRE</option>
            <option value="RESERVADO">RESERVADO</option>
            <option value="CANCELADO">CANCELADO</option>
          </select>
        </div>
        <div>
          <button class="btn-primary" id="btnBuscar">Actualizar listado</button>
        </div>
      </div>

      <div style="overflow-x:auto; max-height:380px;">
        <table id="tablaTurnos">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Tratamiento</th>
              <th>Estado</th>
              <th>Paciente</th>
              <th>Contacto</th>
              <th>Notas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="seccion">
      <h2 style="font-size:1rem; margin-top:0;">Crear turnos masivos</h2>
      <div class="seccion">
  <h2 style="font-size:1rem; margin-top:0;">Configuración del consultorio</h2>
  <label for="cfg_logo_url">URL del logo</label>
  <input type="text" id="cfg_logo_url" placeholder="Pegá aquí la URL de la imagen del logo">
  <button class="btn-secondary" id="btnGuardarLogo">Guardar logo</button>
</div>
      <div class="filtros">
        <div>
          <label for="c_fechaDesde">Fecha desde</label>
          <input type="date" id="c_fechaDesde">
        </div>
        <div>
          <label for="c_fechaHasta">Fecha hasta</label>
          <input type="date" id="c_fechaHasta">
        </div>
        <div>
          <label for="c_horaInicio">Hora inicio</label>
          <input type="time" id="c_horaInicio" value="08:00">
        </div>
        <div>
          <label for="c_horaFin">Hora fin</label>
          <input type="time" id="c_horaFin" value="12:00">
        </div>
        <div>
          <label for="c_duracion">Duración (min)</label>
          <input type="number" id="c_duracion" value="30" min="5">
        </div>
        <div>
          <label for="c_tratamiento">Tratamiento</label>
          <select id="c_tratamiento">
            <option value="">(sin etiqueta)</option>
          </select>
        </div>
      </div>
      <p style="font-size:0.8rem; margin-top:4px;">Días de semana: 
        <label><input type="checkbox" class="c_dia" value="1" checked> Lun</label>
        <label><input type="checkbox" class="c_dia" value="2" checked> Mar</label>
        <label><input type="checkbox" class="c_dia" value="3" checked> Mié</label>
        <label><input type="checkbox" class="c_dia" value="4" checked> Jue</label>
        <label><input type="checkbox" class="c_dia" value="5" checked> Vie</label>
        <label><input type="checkbox" class="c_dia" value="6"> Sáb</label>
        <label><input type="checkbox" class="c_dia" value="0"> Dom</label>
      </p>
      <button class="btn-primary" id="btnCrearMasivos">Crear turnos</button>
    </div>
  </div>

<script>
  // ⬇⬇⬇ PON ACÁ LA URL DEL WEB APP QUE TE DEVUELVE JSON {"ok":true,...}
  const API_URL = "https://script.google.com/macros/s/AKfycbygEE4NKyPNwBb-HbBMsv2GhXuMx1_2T7ZF2hgRgnU/dev";
  async function guardarLogo() {
  const url = document.getElementById("cfg_logo_url").value.trim();
    async function cargarLogo() {
  try {
    const data = await fetchJSON(buildUrl({ action: "getLogoBase64" }));
    if (data.ok && data.base64) {
      const img = document.getElementById("logoConsultorio");
      if (img) {
        img.src = `data:${data.mime};base64,${data.base64}`;
      }
    } else {
      console.warn("No se pudo cargar logo:", data.error);
    }
  } catch (err) {
    console.error("Error al cargar logo", err);
  }
}
  try {
    const res = await fetchJSON(
      buildUrl({ action: "updateLogo" }),
      {
        method: "POST",
        body: JSON.stringify({ logo_url: url })
      }
    );
    if (res.ok) {
      mostrarAlerta("Logo actualizado", "ok");
      const img = document.getElementById("logoConsultorio");
      if (img) img.src = url;
    } else {
      mostrarAlerta(res.error || "No se pudo actualizar el logo", "error");
    }
  } catch (err) {
    console.error(err);
    mostrarAlerta("Error al actualizar el logo", "error");
  }
}

document.getElementById("btnGuardarLogo").addEventListener("click", guardarLogo);
async function cargarConfig() {
  try {
    const data = await fetchJSON(buildUrl({ action: "getConfig" }));
    if (data.ok && data.logo_url) {
      const img = document.getElementById("logoConsultorio");
      if (img) img.src = data.logo_url;
    }
  } catch (err) {
    console.error("Error al cargar config/logo", err);
  }
}

  // Helper para construir la URL con parámetros, aunque API_URL ya tenga '?'
  function buildUrl(paramsObj) {
    const url = new URL(API_URL);
    Object.entries(paramsObj || {}).forEach(([key, value]) => {
      if (value !== undefined && value !== null && value !== "") {
        url.searchParams.set(key, value);
      }
    });
    return url.toString();
  }

  async function fetchJSON(url, options = {}) {
    const res = await fetch(url, options);
    return res.json();
  }

  let tratamientos = [];
  let mapaTratamientos = {};

  function mostrarAlerta(msg, tipo = "ok") {
    const el = document.getElementById("alert");
    el.style.display = "block";
    el.textContent = msg;
    el.className = "alert " + (tipo === "ok" ? "alert-ok" : "alert-error");
  }

  function limpiarAlerta() {
    const el = document.getElementById("alert");
    el.style.display = "none";
  }

  // ============================
  //   Cargar tratamientos
  // ============================
  async function cargarTratamientos() {
    try {
      const data = await fetchJSON(buildUrl({ action: "listarTratamientos" }));
      if (!data.ok) {
        mostrarAlerta("Error al cargar tratamientos", "error");
        return;
      }
      tratamientos = data.tratamientos || [];
      mapaTratamientos = {};
      tratamientos.forEach(t => { mapaTratamientos[t.id_tratamiento] = t; });

      const selFiltro = document.getElementById("f_tratamiento");
      const selCrear = document.getElementById("c_tratamiento");

      selFiltro.innerHTML = '<option value="">Todos</option>';
      selCrear.innerHTML = '<option value="">(sin etiqueta)</option>';

      tratamientos.forEach(t => {
        const opt1 = document.createElement("option");
        opt1.value = t.id_tratamiento;
        opt1.textContent = t.nombre;
        selFiltro.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = t.id_tratamiento;
        opt2.textContent = t.nombre;
        selCrear.appendChild(opt2);
      });

    } catch (err) {
      mostrarAlerta("Error al cargar tratamientos", "error");
      console.error(err);
    }
  }

  // ============================
  //   Cargar turnos
  // ============================
  async function cargarTurnos() {
    limpiarAlerta();
    const fechaDesde = document.getElementById("f_fechaDesde").value;
    const fechaHasta = document.getElementById("f_fechaHasta").value;
    const idTratamiento = document.getElementById("f_tratamiento").value;
    const estado = document.getElementById("f_estado").value;

    const params = { action: "listarTurnosAdmin" };
    if (fechaDesde) params.fechaDesde = fechaDesde;
    if (fechaHasta) params.fechaHasta = fechaHasta;
    if (idTratamiento) params.idTratamiento = idTratamiento;
    if (estado) params.estado = estado;

    try {
      const data = await fetchJSON(buildUrl(params));
      if (!data.ok) {
        mostrarAlerta(data.error || "Error al cargar turnos", "error");
        return;
      }
      renderTablaTurnos(data.turnos || []);
    } catch (err) {
      mostrarAlerta("Error al cargar turnos", "error");
      console.error(err);
    }
  }

  function renderTablaTurnos(turnos) {
    const tbody = document.querySelector("#tablaTurnos tbody");
    tbody.innerHTML = "";

    if (!turnos.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 8;
      td.textContent = "No hay turnos para los filtros seleccionados.";
      td.style.textAlign = "center";
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    turnos.forEach(t => {
      const tr = document.createElement("tr");

      const tratamientoNombre = t.id_tratamiento && mapaTratamientos[t.id_tratamiento]
        ? mapaTratamientos[t.id_tratamiento].nombre
        : "";

      tr.innerHTML = `
        <td>${t.fecha || ""}</td>
        <td>${t.hora_inicio || ""} – ${t.hora_fin || ""}</td>
        <td>${tratamientoNombre}</td>
        <td><span class="estado-${t.estado || ""}">${t.estado || ""}</span></td>
        <td>${t.paciente_nombre || ""}</td>
        <td>${t.paciente_contacto || ""}</td>
        <td>${t.notas || ""}</td>
        <td>
          <button class="btn-secondary" data-accion="libre" data-id="${t.id_turno}">LIBRE</button>
          <button class="btn-danger" data-accion="cancelar" data-id="${t.id_turno}">Cancelar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.addEventListener("click", onClickAccionTurno, { once: true });
  }

  async function onClickAccionTurno(ev) {
    const btn = ev.target.closest("button[data-accion]");
    if (!btn) return;
    const accion = btn.getAttribute("data-accion");
    const id_turno = btn.getAttribute("data-id");

    if (accion === "libre") {
      await actualizarTurnoEstado(id_turno, "LIBRE");
    } else if (accion === "cancelar") {
      await cancelarTurno(id_turno);
    }

    await cargarTurnos();
  }

  async function actualizarTurnoEstado(id_turno, estado) {
    try {
      const res = await fetchJSON(
        buildUrl({ action: "actualizarTurno" }),
        {
          method: "POST",
          body: JSON.stringify({ id_turno, estado })
        }
      );
      if (!res.ok) {
        mostrarAlerta(res.error || "Error al actualizar turno", "error");
      } else {
        mostrarAlerta("Turno actualizado", "ok");
      }
    } catch (err) {
      mostrarAlerta("Error al actualizar turno", "error");
      console.error(err);
    }
  }

  async function cancelarTurno(id_turno) {
    if (!confirm("¿Seguro que querés cancelar este turno?")) return;
    try {
      const res = await fetchJSON(
        buildUrl({ action: "cancelarTurno" }),
        {
          method: "POST",
          body: JSON.stringify({ id_turno })
        }
      );
      if (!res.ok) {
        mostrarAlerta(res.error || "Error al cancelar turno", "error");
      } else {
        mostrarAlerta("Turno cancelado", "ok");
      }
    } catch (err) {
      mostrarAlerta("Error al cancelar turno", "error");
      console.error(err);
    }
  }

  async function crearTurnosMasivos() {
    limpiarAlerta();

    const fechaDesde = document.getElementById("c_fechaDesde").value;
    const fechaHasta = document.getElementById("c_fechaHasta").value;
    const horaInicio = document.getElementById("c_horaInicio").value;
    const horaFin = document.getElementById("c_horaFin").value;
    const duracionMin = parseInt(document.getElementById("c_duracion").value, 10) || 0;
    const id_tratamiento = document.getElementById("c_tratamiento").value;

    const checks = document.querySelectorAll(".c_dia:checked");
    const diasSemana = Array.from(checks).map(ch => parseInt(ch.value, 10));

    if (!fechaDesde || !fechaHasta || !horaInicio || !horaFin || !duracionMin || !diasSemana.length) {
      mostrarAlerta("Completá fechas, horarios, duración y al menos un día de semana", "error");
      return;
    }

    try {
      const res = await fetchJSON(
        buildUrl({ action: "crearTurnosMasivos" }),
        {
          method: "POST",
          body: JSON.stringify({
            fechaDesde,
            fechaHasta,
            horaInicio,
            horaFin,
            duracionMin,
            diasSemana,
            id_tratamiento: id_tratamiento || null
          })
        }
      );
      if (!res.ok) {
        mostrarAlerta(res.error || "Error al crear turnos", "error");
        return;
      }
      mostrarAlerta(`Se generaron ${res.generados || 0} turnos`, "ok");
      await cargarTurnos();
    } catch (err) {
      mostrarAlerta("Error al crear turnos", "error");
      console.error(err);
    }
  }

  document.getElementById("btnBuscar").addEventListener("click", cargarTurnos);
  document.getElementById("btnCrearMasivos").addEventListener("click", crearTurnosMasivos);

  // init
  (async function init() {
  await cargarLogo();
  await cargarTratamientos();
  await cargarTurnos();
})();
  (async function init() {
    (async function init() {
  await cargarConfig();
  // ... resto de init (cargarTratamientos, etc.)
})();
    await cargarTratamientos();
    await cargarTurnos();
  })();
</script>
</body>
</html>
